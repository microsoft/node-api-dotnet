# 
# The Release pipeline to publish NPM and NuGet packages
# to public ADO feeds and, through ESRP Release, to npmjs.com and NuGet.org.
#

# Runs only when microsoft.node-api-dotnet.ci completes on main (see resources
# below); triggers are defined here, not in the ADO pipeline UI.
trigger: none
pr: none
name: $(Date:yyyyMMdd).$(Rev:r)

resources:
  pipelines:
  - pipeline: 'microsoft_node-api-dotnet_ci'
    project: 'ISS'
    source: 'microsoft.node-api-dotnet.ci'
    trigger:
      branches:
        include:
        - main

  repositories:
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      vmImage: windows-latest
      os: windows
    sdl:
      eslint:
        enableExclusions: true
        # This repo does not ship any javascript code. But has many test cases for the js engine that fail parsing, have code considered insecure and crash eslint.
        exclusionPatterns: |
          '**/*.*'

    settings:
      # ESRP publishes centrally without agent access to public registries.
      networkIsolationMode: Enforce

    stages:
    - stage: main_release
      displayName: Publish packages
      jobs:
      - job: nuget_ms_react_native_public_job
        displayName: NuGet to ADO ms/react-native-public feed
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft_node-api-dotnet_ci
            artifactName: published-packages
            targetPath: $(Pipeline.Workspace)\published-packages

        # Use 1ES.PublishNuGet task to securely publish NuGet packages to ms/react-native-public feed.
        steps:
        - script: dir /S $(Pipeline.Workspace)\published-packages
          displayName: Show directory contents

        - script: dotnet nuget list source
          displayName: Show Nuget sources

        - task: AzureCLI@2
          displayName: Override NuGet credentials with Managed Identity
          inputs:
            azureSubscription: 'Office-Hermes-Windows-Bot'
            visibleAzLogin: false
            scriptType: 'pscore'
            scriptLocation: 'inlineScript'
            inlineScript: |
              $accessToken = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv
              # Set the access token as a secret, so it doesn't get leaked in the logs
              Write-Host "##vso[task.setsecret]$accessToken"
              # Override the apitoken of the nuget service connection, for the duration of this stage
              Write-Host "##vso[task.setendpoint id=29e4c04c-ae69-4453-b9f3-bfef7a4c8d32;field=authParameter;key=apitoken]$accessToken"

        - task: 1ES.PublishNuGet@1
          displayName: NuGet push
          inputs:
            useDotNetTask: true
            packageParentPath: '$(Pipeline.Workspace)/published-packages'
            packagesToPush: '$(Pipeline.Workspace)/published-packages/Microsoft.JavaScript.NodeApi.*.nupkg'
            nuGetFeedType: external
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            externalEndpoint: 'Nuget - ms/react-native-public'
            publishPackageMetadata: true

      - job: npm_ms_react_native_job
        displayName: NPM to ADO ms/react-native feed
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft_node-api-dotnet_ci
            artifactName: 'published-packages'
            targetPath: $(Pipeline.Workspace)\published-packages

        # Use the NPM utility to authenticate and publish to ADO ms/react-native feed.
        # PAT-based auth is no longer permitted, so override the service connection's
        # token with an AAD access token obtained via Managed Identity, mirroring the
        # NuGet job above.
        steps:
        - task: NodeTool@0
          displayName: Use Node 22.x
          inputs:
            versionSpec: 22.x

        - task: CmdLine@2
          displayName: Setup npmrc file for react-native feed
          inputs:
            script: |
              echo registry=https://pkgs.dev.azure.com/ms/_packaging/react-native/npm/registry/ > $(Pipeline.Workspace)\published-packages\.npmrc
              echo always-auth=true >> $(Pipeline.Workspace)\published-packages\.npmrc

        - task: AzureCLI@2
          displayName: Override npm credentials with Managed Identity
          inputs:
            azureSubscription: 'Office-Hermes-Windows-Bot'
            visibleAzLogin: false
            scriptType: 'pscore'
            scriptLocation: 'inlineScript'
            inlineScript: |
              $accessToken = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv
              # Set the access token as a secret, so it doesn't get leaked in the logs
              Write-Host "##vso[task.setsecret]$accessToken"
              # Override the apitoken of the npm service connection, for the duration of this stage.
              Write-Host "##vso[task.setendpoint id=9991cb9c-14ba-4683-9a34-100f96f80607;field=authParameter;key=apitoken]$accessToken"

        - task: npmAuthenticate@0
          displayName: npm Authenticate .npmrc
          inputs:
            workingFile: $(Pipeline.Workspace)\published-packages\.npmrc
            customEndpoint: Npm - ms/react-native

        - script: dir /S $(Pipeline.Workspace)\published-packages
          displayName: Show directory contents

        - task: CmdLine@2
          displayName: npm publish to react-native feed
          inputs:
            script: |
              cd $(Pipeline.Workspace)\published-packages
              for %%i in (*.tgz) do npm publish %%i

      - job: nuget_org_job
        displayName: NuGet to nuget.org
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft_node-api-dotnet_ci
            artifactName: 'published-packages'
            targetPath: '$(Pipeline.Workspace)/published-packages'

        # CI has already signed the packages; ESRP handles public distribution.
        steps:
        - pwsh: |
            Get-ChildItem -LiteralPath '$(Pipeline.Workspace)\published-packages' -Recurse -ErrorAction Stop
          displayName: Show directory contents

        - task: CopyFiles@2
          displayName: Stage NuGet packages for ESRP Release
          inputs:
            SourceFolder: '$(Pipeline.Workspace)\published-packages'
            Contents: 'Microsoft.JavaScript.NodeApi.*.nupkg'
            TargetFolder: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'

        - pwsh: |
            Get-ChildItem -LiteralPath '$(Agent.TempDirectory)\esrp-nuget\react-native-windows' -Recurse -ErrorAction Stop
          displayName: Show ESRP submission directory contents

        - task: EsrpRelease@14
          displayName: ESRP Release to NuGet.org
          inputs:
            connectedservicename: 'ESRP-JSHost3'
            usemanagedidentity: false
            keyvaultname: 'OGX-JSHost-KV'
            authcertname: 'OGX-JSHost-Auth4'
            signcertname: 'OGX-JSHost-Sign3'
            clientid: '0a35e01f-eadf-420a-a2bf-def002ba898d'
            domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            intent: 'PackageDistribution'
            contenttype: 'NuGet'
            organizationname: 'react-native-windows'
            contentsource: 'Folder'
            folderlocation: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'
            waitforreleasecompletion: true
            owners: 'vmorozov@microsoft.com'
            approvers: 'khosany@microsoft.com'
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'

      - job: npmjs_com_job
        displayName: NPM to npmjs.com
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft_node-api-dotnet_ci
            artifactName: 'published-packages'
            targetPath: $(Pipeline.Workspace)\published-packages

        # Use ESRP Release to securely publish to npmjs.com.
        steps:
        - script: dir /S $(Pipeline.Workspace)\published-packages
          displayName: Show directory contents

        - task: 'EsrpRelease@14'
          displayName: 'ESRP Release to npmjs.com'
          inputs:
            connectedservicename: 'ESRP-JSHost3'
            usemanagedidentity: false
            keyvaultname: 'OGX-JSHost-KV'
            authcertname: 'OGX-JSHost-Auth4'
            signcertname: 'OGX-JSHost-Sign3'
            clientid: '0a35e01f-eadf-420a-a2bf-def002ba898d'
            domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            contenttype: npm
            folderlocation: $(Pipeline.Workspace)\published-packages
            owners: 'vmorozov@microsoft.com'
            approvers: 'khosany@microsoft.com'
